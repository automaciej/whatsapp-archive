[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-archive"
version = "1.0.0"
description = "Format your exported WhatsApp conversation in HTML."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "python-dateutil",
    "Jinja2",
]

[project.optional-dependencies]
dev = ["parameterized"]

[project.scripts]
whatsapp-archive = "whatsapp_archive:main"

[tool.setuptools]
py-modules = ["whatsapp_archive"]
